name: Scrape and Release Medex Data

on:
  schedule:
    - cron: '0 0 * * 0' # Run every 7 days (every Sunday, exactly 52 times a year)
  workflow_dispatch: # Manual option to start the action workflow

jobs:
  scrape_and_release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SECRET_KEY: rgv8ni2^xx-3gn5h4=go_&*g-+)fu=6tkb1%v=#3g*_89at7#$

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_DB: github_actions
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install psycopg2-binary pytz

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y.%m.%d')" >> $GITHUB_OUTPUT

      - name: Run migrations
        env:
          GITHUB_WORKFLOW: 'true'
        run: |
          python manage.py makemigrations
          python manage.py migrate

      - name: Run Crawler
        env:
          GITHUB_WORKFLOW: 'true'
        run: |
          python run_crawler.py

      - name: Export crawled data to JSON
        env:
          GITHUB_WORKFLOW: 'true'
        run: |
          python manage.py export_json medicine medicine_data
          python manage.py export_json generic generic_data
          python manage.py export_json manufacturer manufacturer_data
          python manage.py export_json dosage_form dosage_form_data
          python manage.py export_json drug_class drug_class_data
          python manage.py export_json indication indication_data

      - name: Create Release and Upload JSON Assets
        uses: softprops/action-gh-release@v1
        with:
          tag_name: medex-data-${{ steps.date.outputs.date }}
          name: Medex Data Release - ${{ steps.date.outputs.date }}
          draft: false
          prerelease: false
          files: |
            medicine_data.json
            generic_data.json
            manufacturer_data.json
            dosage_form_data.json
            drug_class_data.json
            indication_data.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
