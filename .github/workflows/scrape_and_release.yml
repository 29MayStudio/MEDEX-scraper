name: Scrape and Release Medex Data

on:
  workflow_dispatch: # Manual option to start the action workflow

jobs:
  scrape_and_release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y.%m.%d')" >> $GITHUB_OUTPUT

      - name: Run Scraper
        run: |
          python run_scraper.py

      - name: Create Release and Upload Scraping Assets
        uses: softprops/action-gh-release@v1
        with:
          tag_name: medex-data-${{ steps.date.outputs.date }}
          name: Medex Data Release - ${{ steps.date.outputs.date }}
          draft: false
          prerelease: false
          files: |
            medex_data.json
            medex_html_pages.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
